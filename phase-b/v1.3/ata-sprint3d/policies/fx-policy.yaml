policy_id: POL-FX-001
version: '1.0'
status: ACTIVE
scope:
  entities:
  - BrazilCo
  actions:
  - FX_CONVERSION
  - STABLECOIN_CONVERSION
currencies:
  sell:
  - BRL
  buy:
  - USD
  - USDC
assets:
  permitted:
  - USD
  - USDC
